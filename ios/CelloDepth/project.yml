# XcodeGen spec for the iPhone LiDAR streamer.
#   cd ios/CelloDepth && xcodegen && open CelloDepth.xcodeproj
name: CelloDepth
options:
  bundleIdPrefix: mx.urora
  deploymentTarget:
    iOS: "16.0"
targets:
  CelloDepth:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CelloDepth
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Streams the camera and LiDAR depth to the cello projection-mapping app on your Mac.
        NSLocalNetworkUsageDescription: Sends the camera and depth stream to the Mac on this network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true          # ws:// to the Mac's local IP
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.urora.cellodepth
        DEVELOPMENT_TEAM: 23U2HCFC5P
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
