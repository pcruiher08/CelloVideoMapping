<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cello point cloud</title>
<style>
  :root { --bg: #0d0f12; --panel: rgba(20, 23, 28, .86); --text: #e8eaed; --muted: #9aa0a6; --line: #2c3138; --accent: #ff9d3c; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  #bar { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px 14px;
         align-items: center; padding: 10px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  #bar h1 { font-size: 14px; margin: 0 6px 0 0; }
  #bar a { color: var(--muted); }
  #stat { color: var(--muted); flex: 1 1 280px; }
  #stat b { color: var(--text); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--muted); padding: 5px 10px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #111; }
  button.plain { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 5px 10px; font: inherit; cursor: pointer; }
  label { color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  #help { position: fixed; bottom: 12px; left: 12px; color: var(--muted); background: var(--panel);
          padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <h1>Point cloud</h1>
  <div class="seg" id="showSeg">
    <button data-v="all" class="on">Scene, cello highlighted</button>
    <button data-v="cello">Cello only</button>
    <button data-v="colour">Real colour</button>
  </div>
  <label>Point size <input type="range" id="size" min="1" max="8" step="0.5" value="2.5"></label>
  <label><input type="checkbox" id="scanOn" checked> 3D scan</label>
  <button class="plain" id="pause">Pause</button>
  <button class="plain" id="reset">Reset view</button>
  <span id="stat">connecting…</span>
  <a href="/">← back</a>
</div>
<div id="help">Drag to orbit · right-drag to pan · scroll to zoom · cyan: the 3D scan where it was fitted · the camera is at the white marker</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = s => document.querySelector(s);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0f12);
const cam = new THREE.PerspectiveCamera(55, 1, 0.01, 50);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;

// depth camera frame (x right, y down, z ahead) -> three (y up, looking down -z)
const toThree = (x, y, z) => new THREE.Vector3(x, -y, -z);

const geo = new THREE.BufferGeometry();
const mat = new THREE.PointsMaterial({ size: 2.5, sizeAttenuation: false, vertexColors: true });
const points = new THREE.Points(geo, mat);
scene.add(points);

// the depth camera itself, and a 1 m grid on the floor-ish plane below it
const camMark = new THREE.Mesh(new THREE.SphereGeometry(0.025), new THREE.MeshBasicMaterial({ color: 0xffffff }));
scene.add(camMark);
scene.add(new THREE.AxesHelper(0.2));
const grid = new THREE.GridHelper(8, 16, 0x3a4048, 0x22272d);
grid.position.set(0, -1.2, -3);
scene.add(grid);

// the cello's fitted plane: a translucent panel and its normal
const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.45, 0.8),
  new THREE.MeshBasicMaterial({ color: 0xff9d3c, transparent: true, opacity: 0.18, side: THREE.DoubleSide, depthWrite: false }));
const arrow = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 0.3, 0xff9d3c, 0.06, 0.035);
planeMesh.visible = arrow.visible = false;
scene.add(planeMesh, arrow);

// the fitted 3D scan: its points and outline where the fit put them
const scanGeo = new THREE.BufferGeometry();
const scanPts = new THREE.Points(scanGeo, new THREE.PointsMaterial({ size: 3, sizeAttenuation: false, color: 0x4fd6ff }));
const lineGeo = new THREE.BufferGeometry();
const scanLine = new THREE.LineLoop(lineGeo, new THREE.LineBasicMaterial({ color: 0x4fd6ff }));
scene.add(scanPts, scanLine);
let showScan = true;

let show = 'all', paused = false, framed = false;
function resetView(target) {
  const t = target || new THREE.Vector3(0, 0, -2);
  controls.target.copy(t);
  cam.position.set(t.x + 1.6, t.y + 0.6, t.z + 1.2);   // three-quarter view from the camera's side
  controls.update();
}
resetView();

document.querySelectorAll('#showSeg button').forEach(b => b.addEventListener('click', () => {
  show = b.dataset.v;
  document.querySelectorAll('#showSeg button').forEach(x => x.classList.toggle('on', x === b));
  if (last) build(last);
}));
$('#scanOn').addEventListener('change', e => { showScan = e.target.checked; });
$('#size').addEventListener('input', e => { mat.size = +e.target.value; });
$('#pause').addEventListener('click', () => { paused = !paused; $('#pause').textContent = paused ? 'Resume' : 'Pause'; });
$('#reset').addEventListener('click', () => resetView(celloCentre));

let last = null, celloCentre = null;
function build(d) {
  const { hd, buf, off } = d;
  const n = hd.count, f = new Float32Array(buf, off, n * 4), u = new Uint8Array(buf, off, n * 16);
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  let k = 0, cx = 0, cy = 0, cz = 0, nc = 0;
  for (let i = 0; i < n; i++) {
    const x = f[4 * i], y = f[4 * i + 1], z = f[4 * i + 2];
    const b = u[16 * i + 12], g = u[16 * i + 13], r = u[16 * i + 14], on = u[16 * i + 15];
    if (on) { cx += x; cy += y; cz += z; nc++; }
    if (show === 'cello' && !on) continue;
    pos[3 * k] = x; pos[3 * k + 1] = -y; pos[3 * k + 2] = -z;
    if (show === 'colour' || (show === 'cello')) {
      col[3 * k] = r / 255; col[3 * k + 1] = g / 255; col[3 * k + 2] = b / 255;
      if (show === 'cello') { col[3 * k] = Math.min(1, col[3 * k] * 0.6 + 0.4); col[3 * k + 1] *= 0.85; }
    } else if (on) {
      col[3 * k] = 1.0; col[3 * k + 1] = 0.62; col[3 * k + 2] = 0.24;      // the cello: orange
    } else {
      const t = Math.min(1, Math.max(0, (z - 0.5) / 4));                     // the rest: grey, darker far away
      const v = 0.75 - 0.5 * t;
      col[3 * k] = v * 0.8; col[3 * k + 1] = v * 0.88; col[3 * k + 2] = v;
    }
    k++;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, 3 * k), 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col.subarray(0, 3 * k), 3));
  geo.computeBoundingSphere();
  celloCentre = nc ? toThree(cx / nc, cy / nc, cz / nc) : null;
  if (!framed && celloCentre) { resetView(celloCentre); framed = true; }

  const sc = hd.scan;
  scanPts.visible = scanLine.visible = !!sc && showScan;
  if (sc) {
    const flat = a => { const f = new Float32Array(a.length * 3); a.forEach((q, i) => { f[3 * i] = q[0]; f[3 * i + 1] = -q[1]; f[3 * i + 2] = -q[2]; }); return f; };
    scanGeo.setAttribute('position', new THREE.BufferAttribute(flat(sc.points), 3));
    lineGeo.setAttribute('position', new THREE.BufferAttribute(flat(sc.outline), 3));
    scanGeo.computeBoundingSphere(); lineGeo.computeBoundingSphere();
  }
  const p = hd.plane;
  planeMesh.visible = arrow.visible = !!p;
  let txt = `<b>${n.toLocaleString()}</b> points · cello <b>${hd.cello.toLocaleString()}</b>`;
  txt += sc ? ' · <span style="color:#4fd6ff">3D scan fitted</span>' : '';
  if (p) {
    const C = toThree(...p.C), N = toThree(...p.n).normalize();
    planeMesh.position.copy(C);
    // the panel's long side along the cello: as upright as the plane allows
    const up = new THREE.Vector3(0, 1, 0).projectOnPlane(N).normalize();
    const m = new THREE.Matrix4().makeBasis(new THREE.Vector3().crossVectors(up, N), up, N);
    planeMesh.quaternion.setFromRotationMatrix(m);
    arrow.position.copy(C); arrow.setDirection(N);
    const dist = Math.hypot(...p.C);
    const lean = Math.atan2(-p.n[1], -p.n[2]) * 180 / Math.PI, turn = Math.atan2(p.n[0], -p.n[2]) * 180 / Math.PI;
    txt += ` · plane at <b>${dist.toFixed(2)} m</b>, lean ${lean.toFixed(1)}°, turn ${turn.toFixed(1)}°`
         + (p.residual_mm !== undefined ? `, ±${p.residual_mm} mm` : '') + ` (${p.source})`;
  } else if (!hd.cello) {
    txt += ' · <span style="color:var(--accent)">no cello in view</span>';
  }
  $('#stat').innerHTML = txt;
}

async function poll() {
  while (true) {
    if (!paused) {
      try {
        const r = await fetch('/api/cloud.bin?step=1', { cache: 'no-store' });
        if (r.ok) {
          const buf = await r.arrayBuffer();
          const len = new DataView(buf).getUint32(0, true);
          const hd = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 4, len)));
          // records start 4-byte aligned for the Float32Array view
          let off = 4 + len;
          if (off % 4) { const copy = new Uint8Array(buf.byteLength - off); copy.set(new Uint8Array(buf, off)); last = { hd, buf: copy.buffer, off: 0 }; }
          else last = { hd, buf, off };
          build(last);
        } else {
          $('#stat').textContent = (await r.json()).detail || `error ${r.status}`;
        }
      } catch (e) { $('#stat').textContent = 'server not reachable'; }
    }
    await new Promise(res => setTimeout(res, 120));
  }
}
poll();

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, cam); });
</script>
</body>
</html>
